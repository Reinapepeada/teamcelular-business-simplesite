name: Footer responsive QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/components/footer/**'
      - 'tests/footer-browser.js'
      - '.github/workflows/footer-browser.yml'
permissions:
  contents: read
jobs:
  footer-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install isolated browser test tool
        run: npm install --no-save --package-lock=false playwright@1.57.0 && npx playwright install --with-deps chromium
      - name: Compare original and compact footer with fake-only browser traffic
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_URL: http://127.0.0.1:3027
          COMMERCE_PREFLIGHT_ALLOW_LOOPBACK: '1'
        run: |
          cp src/components/footer/FooterNUI.tsx /tmp/footer-after.tsx
          git show "$BASE_SHA:src/components/footer/FooterNUI.tsx" > src/components/footer/FooterNUI.tsx
          npm run dev -- --hostname 127.0.0.1 --port 3027 > /tmp/footer-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true; cp /tmp/footer-after.tsx src/components/footer/FooterNUI.tsx' EXIT
          for i in $(seq 1 60); do curl --silent --fail http://127.0.0.1:3027/terminos > /dev/null && break; sleep 2; done
          node tests/footer-browser.js before
          cp /tmp/footer-after.tsx src/components/footer/FooterNUI.tsx
          sleep 3
          node tests/footer-browser.js after
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: footer-responsive-evidence
          path: footer-evidence/
