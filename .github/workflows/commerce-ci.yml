name: Storefront Commerce CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      # Playwright 1.64.1: Chromium and system libraries are bundled, without APT at runtime.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm test
      - name: Build with isolated same-origin topology
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_URL: https://store.example.test
      - name: Check TypeScript with generated Next.js types
        run: npx --no-install tsc --noEmit
      - name: Verify bundled browser version matches the project
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.64.1')"
      - name: Checkout recovery with fake services only
        run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkout-recovery-browser-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
