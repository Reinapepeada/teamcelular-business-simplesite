name: Storefront Commerce CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storefront-commerce-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run lint
      - run: npm test
      - name: Build with isolated same-origin topology
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_URL: https://store.example.test
      - name: Check TypeScript with generated Next.js types
        run: npx --no-install tsc --noEmit
      - name: Install isolated test browser
        run: npx playwright install --with-deps chromium
      - name: Checkout recovery with fake services only
        run: npm run test:browser
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: checkout-recovery-browser-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: ignore
